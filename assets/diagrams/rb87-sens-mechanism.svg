<text x="635" y="197.7" class="xs">잡음 밀도 = 둘의 비</text>
<text x="16" y="362" class="xs">회전 진폭은 증기 밀도를 따라 자랍니다. 주파수를 읽는 정밀도는 감쇠율의 3/2제곱으로 나빠집니다.</text>
<text x="16" y="376" class="xs">γ₂ = a + bn이라 낮은 온도에서는 a가 지배해 신호만 자라고, 높은 온도에서는 bn이 지배해 n^(1/2)로 나빠집니다.</text>
<text x="16" y="390" class="xs">해석적으로는 bn = 2a인 곳(약 77 °C)이 최소입니다. 실제로 81 °C인 것은 최적 detuning이 함께 움직여 진폭이 n보다 빨리 자라기 때문입니다.</text>
</svg>
