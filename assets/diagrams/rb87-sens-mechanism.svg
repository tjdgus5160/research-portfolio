<title id="mct">The competition that sets the temperature</title><desc id="mcd">Signal amplitude and the three-halves power of the decay rate against temperature, and their ratio. The first grows with vapour density, the second grows faster once spin exchange takes over, and the ratio has a minimum between them.</desc>
