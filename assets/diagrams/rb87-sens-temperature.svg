<text x="244" y="172" class="xs" text-anchor="middle">81 °C — 36 fT/√Hz</text>
<text x="556" y="105" class="xs">광자 산탄 잡음 한계</text>
<text x="343" y="277" class="xs">스핀 투영 잡음 — 원자 자체의 한계</text>
<line x1="370" y1="316" x2="370" y2="307" class="thin"/>
<line x1="503" y1="316" x2="503" y2="307" class="thin"/>
<text x="16" y="376" class="xs">차가우면 원자가 모자라 신호가 작고, 뜨거우면 스핀 교환이 T₂를 먼저 죽입니다. 그 사이에 최소가 있습니다.</text>
<text x="16" y="390" class="xs">최적은 81 °C입니다 — T/03부터 T/06까지가 예로 들어온 100~150 °C보다 한참 아래입니다.</text>
<text x="16" y="404" class="xs">두 곡선이 20배 넘게 벌어져 있습니다. 이 셀은 원자가 아니라 광자에 막혀 있고, 그래서 프로브 출력이 아직 이깁니다.</text>
</svg>
