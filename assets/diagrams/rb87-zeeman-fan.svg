<text x="646" y="309.9" class="xs">m +2 → +1</text>
<text x="646" y="232.7" class="xs">m +1 → +0</text>
<text x="646" y="155.4" class="xs">m +0 → -1</text>
<text x="646" y="78.0" class="xs">m -1 → -2</text>
<text x="104" y="99.6" class="xs">to first order all four lie on zero</text>
<text x="16" y="376" class="xs">Adjacent transitions separate by 143.79 Hz/G² — exactly a quarter of the clock shift Steck tabulates as 575.15 Hz/G².</text>
<text x="16" y="390" class="xs">That relation is not put in. It falls out of diagonalising the Breit-Rabi formula, and it is how this calculation checks itself.</text>
<text x="16" y="404" class="xs">At Earth's field, 0.5 G, the outer two sit ±54 Hz from the centre. The linewidth at Γ_g = 170 s⁻¹ is 54 Hz.</text>
</svg>
