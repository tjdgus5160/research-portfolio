<title id="fnt">Second-order Zeeman splitting of the F=2 transitions</title><desc id="fnd">Four curves showing how the Delta-m = 1 transition frequencies inside F=2 separate quadratically with magnetic field once the linear Larmor term is removed, reaching about 215 hertz at one gauss.</desc>
