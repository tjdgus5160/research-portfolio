<text x="276" y="74" class="xs">2 × T₂ — Hunter가 적은 최적 창</text>
<text x="483" y="185" class="xs">펌프 시간을 포함</text>
<text x="483" y="217" class="xs">관측 시간만</text>
<text x="16" y="362" class="xs">더 오래 보면 데이터가 늘지만 신호가 이미 죽어 있어 새 정보가 없고, 다음 측정이 그만큼 늦어집니다.</text>
<text x="16" y="376" class="xs">펌프 없이 계산하면 최소가 정확히 2·T₂에 떨어집니다 — 논문이 적은 값 그대로입니다.</text>
<text x="16" y="390" class="xs">1 ms 펌프를 넣으면 2.2·T₂로 조금 밀리고, 2·T₂를 그대로 써도 손해는 보이지 않습니다.</text>
</svg>
