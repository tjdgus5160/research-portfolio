<text x="658" y="67.6" class="xs">120 °C</text>
<text x="658" y="79.6" class="xs">OD 3.2</text>
<line x1="636" y1="91.1" x2="654" y2="89.6" class="dash"/>
<text x="658" y="93.6" class="xs">140 °C</text>
<text x="658" y="105.6" class="xs">OD 9.4</text>
<text x="658" y="159.0" class="xs">145 °C</text>
<text x="658" y="171.0" class="xs">OD 12.2</text>
<text x="658" y="260.5" class="xs">150 °C</text>
<text x="658" y="272.5" class="xs">OD 15.7</text>
<text x="16" y="376" class="xs">The front polarises the same way at every temperature. What changes is how far the bleaching front gets in 1 ms.</text>
<text x="16" y="390" class="xs">80 and 100 °C are not drawn: at OD 0.2 and 0.9 they lie exactly on the 120 °C line.</text>
<text x="16" y="404" class="xs">Each slab is the eight-sublevel solve of T/05, so the stretched state is genuinely dark and the vapour opens a channel for itself.</text>
</svg>
