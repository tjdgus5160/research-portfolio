<line x1="93" y1="69.0" x2="104" y2="155.0" class="dash"/>
<text x="108" y="158.0" class="xs">30 mW/cm², OD 0.2 — best -3.75 GHz, swing 1%</text>
<line x1="93" y1="108.1" x2="104" y2="177.0" class="dash"/>
<text x="108" y="180.0" class="xs">10 mW/cm², OD 0.2 — best -3.75 GHz, swing 11%</text>
<line x1="93" y1="118.5" x2="104" y2="199.0" class="dash"/>
<text x="108" y="202.0" class="xs">30 mW/cm², OD 15.7 — best -3.75 GHz, swing 3%</text>
<line x1="93" y1="236.2" x2="104" y2="221.0" class="dash"/>
<text x="108" y="224.0" class="xs">10 mW/cm², OD 15.7 — best -2.75 GHz, swing 4%</text>
<text x="16" y="376" class="xs">At 30 mW/cm² the optimum does not move at all between OD 0.2 and OD 16. At 10 mW/cm² it moves 1 GHz — and toward resonance, not away from it.</text>
<text x="16" y="390" class="xs">Detuning buys penetration, but only for a beam strong enough to bleach a path. A weak beam in a thick cell is set by its front layers.</text>
<text x="16" y="404" class="xs">Every peak here is shallow. The marked maximum stands 1 to 12 per cent above the worst point in a twelve gigahertz window.</text>
</svg>
