<text x="84" y="195" class="xs" text-anchor="end">0.5</text>
<line x1="92" y1="126" x2="660" y2="126" class="dash"/>
<text x="84" y="130" class="xs" text-anchor="end">0.75</text>
<line x1="92" y1="62" x2="660" y2="62" class="dash"/>
<text x="84" y="66" class="xs" text-anchor="end">1</text>
