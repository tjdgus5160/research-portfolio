<text x="98" y="61.1" class="xs">10 mW/cm², best -3.5 GHz</text>
<text x="98" y="89.9" class="xs">5 mW/cm², best -3.5 GHz</text>
<text x="98" y="132.6" class="xs">1 mW/cm², best -3.5 GHz</text>
<line x1="416" y1="60" x2="416" y2="320" class="thin"/>
<text x="411" y="312" class="xs" text-anchor="end">this solve: −3.5</text>
<text x="16" y="376" class="xs">An independent calculation reviewed in T/03 put the optimum at −3.62 to −3.69 GHz. This one, built from</text>
<text x="16" y="390" class="xs">Wigner coefficients and sharing none of its code, lands at −3.5 GHz. Two routes, the same answer within 0.2 GHz.</text>
</svg>
