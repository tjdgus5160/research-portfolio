<text x="654" y="335.3" class="xs">0.05 ms</text>
<text x="16" y="376" class="xs">A thick cell does not polarise all over at once. The front tenth clears first, stops absorbing, and hands the beam to the next tenth.</text>
<text x="16" y="390" class="xs">At 0.2 ms the back is untouched; by 1 ms the front has swept nine tenths of the way through. Nothing in the model puts it there.</text>
</svg>
