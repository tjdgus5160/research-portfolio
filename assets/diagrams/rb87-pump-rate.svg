<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
  role="img" aria-labelledby="rt rd" class="lvl">
<title id="rt">Photon scattering rate per atom against time</title><desc id="rd">The scattering rate starts at its unpolarised value and decays as the ensemble polarises, because an atom in the stretched state cannot absorb another sigma-plus photon. Higher intensity starts higher and decays faster. What is left at long times is only the light needed to hold the polarisation against ground-state relaxation.</desc>
