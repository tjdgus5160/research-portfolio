<text x="102.0" y="50.0" class="xs">50 mW/cm²</text>
<text x="16" y="392" class="xs">The rate falls because a polarised atom cannot absorb another σ+ photon — the sample bleaches itself.</text>
<text x="16" y="406" class="xs">σ = 4.08e-13 cm² from f = 0.34231 and the 14.19 GHz width; no fitted constant in the rate itself.</text>
<text x="16" y="420" class="xs">What remains at long times is the light needed to hold against Γg = 170 s⁻¹, not to build the polarisation.</text>
</svg>
