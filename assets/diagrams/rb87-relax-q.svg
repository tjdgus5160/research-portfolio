<text x="108" y="73.7" class="xs">T/04이 모델 입력으로 넣은 n_cycle = 10</text>
<rect x="100" y="227.5" width="520" height="8.9" fill="var(--t2,#8a8a8a)" opacity="0.45"/>
<text x="256" y="249" class="xs">T/05가 독립적으로 잰 값 5.58 – 5.83 (펌핑 전 구간 평균)</text>
<text x="126" y="216" class="xs">q = 6 (편광 없음)</text>
<text x="614" y="308" class="xs" text-anchor="end">q = 2I+1 = 4 (완전 편광)</text>
<text x="16" y="362" class="xs">핵이 붙들고 있는 각운동량 때문에 전자 스핀 하나를 뒤집으려면 광자 몇 개가 듭니다. 그 개수가 q이고, Seltzer 표 2.5에 있습니다.</text>
<text x="16" y="376" class="xs">T/04은 이것을 10이라는 맞춰진 상수로 들고 있었습니다. T/05는 준위별로 풀어서 5.6~5.8을 얻었지만 그것이 무엇인지는 몰랐습니다.</text>
<text x="16" y="390" class="xs">같은 수입니다. 가정도 맞춤도 아니라 표에 적혀 있는 값이고, 이 사이트의 두 계산이 서로 모르는 채로 그것을 재현했습니다.</text>
</svg>
