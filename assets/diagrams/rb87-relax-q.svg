<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400"
  role="img" aria-labelledby="qst qsd" class="lvl">
<title id="qst">The nuclear slowing-down factor</title><desc id="qsd">The slowing-down factor against spin polarisation, falling from six to four. The value T/05 measured independently lands on the curve; the value T/04 assumed, ten, is off the top of it.</desc>
<style>
  .lvl{font-family:"IBM Plex Mono","SF Mono",monospace}
  .l{stroke:var(--t0,#0d0d0d);stroke-width:3;fill:none}
  .m{stroke:var(--t1,#3a3a3a);stroke-width:2;fill:none}
  .thin{stroke:var(--t1,#3a3a3a);stroke-width:1.5;fill:none}
  .dash{stroke:var(--t2,#8a8a8a);stroke-width:1;stroke-dasharray:3 4;fill:none}
  text{fill:var(--t0,#0d0d0d);font-size:11px}
  .sm{font-size:9px;fill:var(--t1,#3a3a3a)}
  .xs{font-size:8px;fill:var(--t1,#3a3a3a);letter-spacing:.05em}
  .xs,.sm{paint-order:stroke fill;stroke:var(--t3,#d7d7d7);stroke-width:3px;
    stroke-linejoin:round}
</style>
<text x="16" y="22" class="xs">n_cycle WAS NEVER A FREE PARAMETER</text>
<text x="744" y="22" class="xs" text-anchor="end">NUCLEAR SLOWING-DOWN FACTOR, I = 3/2</text>
<line x1="100" y1="292.3" x2="620" y2="292.3" class="dash"/>
<text x="92" y="296.3" class="xs" text-anchor="end">4</text>
<line x1="100" y1="221.4" x2="620" y2="221.4" class="dash"/>
<text x="92" y="225.4" class="xs" text-anchor="end">6</text>
<line x1="100" y1="150.6" x2="620" y2="150.6" class="dash"/>
<text x="92" y="154.6" class="xs" text-anchor="end">8</text>
<line x1="100" y1="79.7" x2="620" y2="79.7" class="dash"/>
<text x="92" y="83.7" class="xs" text-anchor="end">10</text>
<text x="100.0" y="328" class="xs" text-anchor="middle">0</text>
<text x="230.0" y="328" class="xs" text-anchor="middle">0.25</text>
<text x="360.0" y="328" class="xs" text-anchor="middle">0.5</text>
<text x="490.0" y="328" class="xs" text-anchor="middle">0.75</text>
<text x="620.0" y="328" class="xs" text-anchor="middle">1</text>
<line x1="100" y1="310" x2="620" y2="310" class="thin"/>
<line x1="100" y1="310" x2="100" y2="62" class="thin"/>
<text x="360.0" y="348" class="sm" text-anchor="middle">spin polarisation P</text>
<text x="24" y="186.0" class="sm" transform="rotate(-90 24 186.0)" text-anchor="middle">q</text>
