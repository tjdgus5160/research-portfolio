<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396"
  role="img" aria-labelledby="odt odd" class="lvl">
<title id="odt">Optical depth against cell temperature</title><desc id="odd">Optical depth of a 5.5 mm rubidium path against temperature, on a log scale, for natural and enriched 87Rb. Enrichment shifts the curve up by a factor of 2.5, moving the temperature at which the cell becomes optically thick down by about twenty degrees.</desc>
<style>
  .lvl{font-family:"IBM Plex Mono","SF Mono",monospace}
  .l{stroke:var(--t0,#0d0d0d);stroke-width:3;fill:none}
  .m{stroke:var(--t1,#3a3a3a);stroke-width:2;fill:none}
  .thin{stroke:var(--t1,#3a3a3a);stroke-width:1.5;fill:none}
  .dash{stroke:var(--t2,#8a8a8a);stroke-width:1;stroke-dasharray:3 4;fill:none}
  text{fill:var(--t0,#0d0d0d);font-size:11px}
  .sm{font-size:9px;fill:var(--t1,#3a3a3a)}
  .xs{font-size:8px;fill:var(--t1,#3a3a3a);letter-spacing:.05em}
  /* A label that lands on a gridline or a curve is unreadable. Paint the
     ground colour behind the glyphs first, then the glyphs. */
  .xs,.sm{paint-order:stroke fill;stroke:var(--t3,#d7d7d7);stroke-width:3px;
    stroke-linejoin:round}
</style>
<text x="16" y="22" class="xs">OPTICAL DEPTH OF A 5.5 mm PATH</text>
<text x="744" y="22" class="xs" text-anchor="end">LOG SCALE</text>
<line x1="96" y1="300" x2="660" y2="300" class="dash"/>
<text x="88" y="304" class="xs" text-anchor="end">0.01</text>
<line x1="96" y1="240" x2="660" y2="240" class="dash"/>
<text x="88" y="244" class="xs" text-anchor="end">0.1</text>
<line x1="96" y1="180" x2="660" y2="180" class="dash"/>
<text x="88" y="184" class="xs" text-anchor="end">1</text>
<line x1="96" y1="120" x2="660" y2="120" class="dash"/>
<text x="88" y="124" class="xs" text-anchor="end">10</text>
<line x1="96" y1="60" x2="660" y2="60" class="dash"/>
<text x="88" y="64" class="xs" text-anchor="end">100</text>
<text x="96" y="318" class="xs" text-anchor="middle">60</text>
<text x="209" y="318" class="xs" text-anchor="middle">80</text>
<text x="322" y="318" class="xs" text-anchor="middle">100</text>
<text x="434" y="318" class="xs" text-anchor="middle">120</text>
<text x="547" y="318" class="xs" text-anchor="middle">140</text>
<text x="660" y="318" class="xs" text-anchor="middle">160</text>
<line x1="96" y1="300" x2="660" y2="300" class="thin"/>
<line x1="96" y1="300" x2="96" y2="60" class="thin"/>
<text x="378.0" y="338" class="sm" text-anchor="middle">cell temperature / °C</text>
<text x="26" y="180.0" class="sm" transform="rotate(-90 26 180.0)" text-anchor="middle">optical depth</text>
