<text x="260" y="250.3" class="xs" text-anchor="start">natural, 27.8% 87Rb</text>
<polyline class="l" points="96.0,256.8 107.3,252.6 118.6,248.5 129.8,244.4 141.1,240.4 152.4,236.4 163.7,232.4 175.0,228.5 186.2,224.7 197.5,220.9 208.8,217.1 220.1,213.4 231.4,209.7 242.6,206.1 253.9,202.5 265.2,198.9 276.5,195.4 287.8,192.0 299.0,188.5 310.3,185.1 321.6,181.8 332.9,178.4 344.2,175.2 355.4,171.9 366.7,168.7 378.0,165.5 389.3,162.4 400.6,159.2 411.8,156.2 423.1,153.1 434.4,150.1 445.7,147.1 457.0,144.1 468.2,141.2 479.5,138.3 490.8,135.4 502.1,132.6 513.4,129.8 524.6,127.0 535.9,124.3 547.2,121.5 558.5,118.8 569.8,116.2 581.0,113.5 592.3,110.9 603.6,108.3 614.9,105.7 626.2,103.2 637.4,100.6 648.7,98.1 660.0,95.7"/>
<text x="225" y="197.7" class="xs" text-anchor="end">enriched, 69.3%</text>
<line x1="96" y1="151" x2="660" y2="151" class="dash"/>
<text x="102" y="146" class="xs">OD 3 — where an unpumped cell would go dark</text>
<line x1="96" y1="120" x2="660" y2="120" class="thin"/>
<text x="102" y="115" class="xs">OD 10 — where a pumped one does, at 30 mW/cm²</text>
<text x="16" y="358" class="xs">Density from the model Steck quotes, stated accurate to ±5% over 298–550 K. Cross section from T/04.</text>
<text x="16" y="372" class="xs">The gap between the curves is one assumption: whether the cell is isotopically enriched. It moves the useful temperature by ~20 °C.</text>
<text x="16" y="386" class="xs">The two thresholds differ because a polarised atom stops absorbing. Bleaching buys about 20 °C of headroom over the unpumped estimate.</text>
</svg>
