<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414"
  role="img" aria-labelledby="ttt ttd" class="lvl">
<title id="ttt">Longitudinal and transverse lifetimes</title><desc id="ttd">Longitudinal and transverse spin lifetimes against cell temperature on a log scale. They are comparable at eighty degrees and differ by more than a hundredfold at a hundred and fifty, because spin exchange broadens only the transverse component.</desc>
<style>
  .lvl{font-family:"IBM Plex Mono","SF Mono",monospace}
  .l{stroke:var(--t0,#0d0d0d);stroke-width:3;fill:none}
  .m{stroke:var(--t1,#3a3a3a);stroke-width:2;fill:none}
  .thin{stroke:var(--t1,#3a3a3a);stroke-width:1.5;fill:none}
  .dash{stroke:var(--t2,#8a8a8a);stroke-width:1;stroke-dasharray:3 4;fill:none}
  text{fill:var(--t0,#0d0d0d);font-size:11px}
  .sm{font-size:9px;fill:var(--t1,#3a3a3a)}
  .xs{font-size:8px;fill:var(--t1,#3a3a3a);letter-spacing:.05em}
  .xs,.sm{paint-order:stroke fill;stroke:var(--t3,#d7d7d7);stroke-width:3px;
    stroke-linejoin:round}
</style>
<text x="16" y="22" class="xs">T₁ AND T₂ ARE NOT THE SAME NUMBER</text>
<text x="744" y="22" class="xs" text-anchor="end">LOG SCALE, 0.5 G</text>
<line x1="100" y1="320.0" x2="640" y2="320.0" class="dash"/>
<text x="92" y="324.0" class="xs" text-anchor="end">0.01</text>
<line x1="100" y1="255.5" x2="640" y2="255.5" class="dash"/>
<text x="92" y="259.5" class="xs" text-anchor="end">0.1</text>
<line x1="100" y1="191.0" x2="640" y2="191.0" class="dash"/>
<text x="92" y="195.0" class="xs" text-anchor="end">1</text>
<line x1="100" y1="126.5" x2="640" y2="126.5" class="dash"/>
<text x="92" y="130.5" class="xs" text-anchor="end">10</text>
<line x1="100" y1="62.0" x2="640" y2="62.0" class="dash"/>
<text x="92" y="66.0" class="xs" text-anchor="end">100</text>
<text x="100.0" y="338" class="xs" text-anchor="middle">80</text>
<text x="235.0" y="338" class="xs" text-anchor="middle">100</text>
<text x="370.0" y="338" class="xs" text-anchor="middle">120</text>
<text x="505.0" y="338" class="xs" text-anchor="middle">140</text>
<text x="640.0" y="338" class="xs" text-anchor="middle">160</text>
