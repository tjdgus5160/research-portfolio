<text x="646" y="128.0" class="xs">T₁ — 세로 완화</text>
<polyline class="l" points="100.0,147.4 113.5,150.5 127.0,153.6 140.5,156.7 154.0,159.9 167.5,163.2 181.0,166.5 194.5,169.8 208.0,173.1 221.5,176.4 235.0,179.8 248.5,183.1 262.0,186.5 275.5,189.8 289.0,193.1 302.5,196.5 316.0,199.8 329.5,203.0 343.0,206.3 356.5,209.5 370.0,212.8 383.5,216.0 397.0,219.1 410.5,222.3 424.0,225.4 437.5,228.5 451.0,231.6 464.5,234.6 478.0,237.6 491.5,240.6 505.0,243.6 518.5,246.6 532.0,249.5 545.5,252.4 559.0,255.2 572.5,258.1 586.0,260.9 599.5,263.7 613.0,266.4 626.5,269.2 640.0,271.9"/>
<text x="646" y="274.9" class="xs">T₂ — 스핀 교환이 지배</text>
<line x1="100" y1="141.4" x2="640" y2="141.4" class="thin"/>
<text x="108" y="135.4" class="xs">T/07이 쓴 T₂ = 5.88 ms (= 1/170)</text>
<text x="16" y="376" class="xs">T/07은 Γ_g가 세로 이완률인데 그것을 T₂로 썼습니다 — T₁ = T₂를 가정한 것입니다. Seltzer 식 2.135는 그렇지 않다고 말합니다.</text>
<text x="16" y="390" class="xs">Rb–Rb 스핀 교환이 T₂를 따로 갉아먹고, 그 속도는 증기 밀도를 따라 지수적으로 커집니다.</text>
<text x="16" y="404" class="xs">100 °C에서 T₁ 16.4 ms에 T₂ 1.49 ms, 150 °C에서는 12.2 ms에 0.09 ms. 뜨거울수록 신호는 세지고 선은 넓어집니다.</text>
</svg>
