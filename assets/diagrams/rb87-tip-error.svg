<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414"
  role="img" aria-labelledby="tpt tpd" class="lvl">
<title id="tpt">Field error against tip angle</title><desc id="tpd">Apparent magnetic field error against the tip angle of the pulse, passing through zero at exactly ninety degrees and rising to about 0.65 nanotesla five degrees away.</desc>
