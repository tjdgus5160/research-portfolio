<text x="376" y="207" class="xs" text-anchor="end">exactly zero at π/2</text>
<circle cx="405.2" cy="180.5" r="2.5" fill="var(--t0,#0d0d0d)"/>
<text x="413" y="172" class="xs">5° off → +0.65 nT</text>
<text x="16" y="376" class="xs">At exactly π/2 the coherence weights are symmetric whatever the pumping left behind, so the second-order Zeeman cancels out of the centroid.</text>
<text x="16" y="390" class="xs">Away from π/2 it does not, and the field reads 0.130 nT per degree. Repeating the measurement does not help: the error is in the pulse.</text>
<text x="16" y="404" class="xs">It scales as B², so the same pulse error costs a hundred times less at 5 μT — and four times more at 1 gauss.</text>
</svg>
