<title id="opt">Optimum buffer gas pressure</title><desc id="opd">Wall diffusion falls as one over density while nitrogen spin destruction rises linearly with it, so the total relaxation rate has a minimum. This cell's 650 Torr fill sits essentially on that minimum.</desc>
