<text x="378" y="231" class="xs">N₂와의 스핀 파괴 ∝ n</text>
<text x="359" y="293" class="xs">벽으로의 확산 ∝ 1/n</text>
<text x="223" y="263" class="xs" text-anchor="middle">최적 0.73 amg</text>
<text x="242" y="74" class="xs">이 셀 0.797 amg (650 Torr)</text>
<text x="16" y="376" class="xs">완충기체를 더 넣으면 벽까지 가는 데 오래 걸리지만 N₂와 부딪히는 횟수가 늘어납니다. 그 둘이 만나는 곳이 최소입니다.</text>
<text x="16" y="390" class="xs">이 셀은 0.797 amg, 최적은 0.73 amg. 완화율 차이는 0.4%입니다 — 사실상 최적점에 있습니다.</text>
<text x="16" y="404" class="xs">같은 코드로 Seltzer 그림 2.23(He 속 ³⁹K, 반지름 2.5 cm 구형 셀)을 계산하면 0.90–1.10 amg가 나옵니다. 본인이 적은 값은 "약 1 amg"입니다.</text>
</svg>
