<text x="638" y="200.8" class="xs">1/T₁ = 합</text>
<text x="638" y="277.5" class="xs">R_SD(N₂)/q</text>
<line x1="618" y1="281.2" x2="634" y2="287.5" class="dash"/>
<text x="638" y="291.5" class="xs">R_SD(Rb–Rb)/q</text>
<line x1="618" y1="282.1" x2="634" y2="301.5" class="dash"/>
<text x="638" y="305.5" class="xs">R_wall</text>
<line x1="96" y1="100.7" x2="618" y2="100.7" class="thin"/>
<text x="104" y="94.7" class="xs">Γ_g = 170 s⁻¹ — T/03부터 T/07까지 가정한 값</text>
<text x="16" y="376" class="xs">단면적은 전부 Seltzer 논문 표 A.2의 루비듐 열입니다. 자유 인자는 없고, 이 셀의 기하와 충전 밀도만 들어갑니다.</text>
<text x="16" y="390" class="xs">지배적인 것은 N₂와의 스핀 파괴이고, 벽 확산이 그 다음입니다. Rb–Rb는 150 °C가 넘어서야 끼어듭니다.</text>
<text x="16" y="404" class="xs">가정했던 170은 실제의 두세 배입니다. 그만큼 펌핑은 여태 적어둔 것보다 쉽습니다.</text>
</svg>
