<title id="ppt">Stretched-state population against time</title><desc id="ppd">Population in the stretched state climbs toward a plateau set by the balance between pumping and ground-state relaxation. The time constant is 235 microseconds at 10 mW/cm2 and 49 microseconds at 50, so a 1 ms pulse is several time constants long above about 20 mW/cm2.</desc>
